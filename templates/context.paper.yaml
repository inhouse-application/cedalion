data:                                  # What (data); Zotero dataset field names
  - {title: , repository: , versionNumber: , DOI: , loc: }
region:   {text: , loc: }              # Where
period:   {start_datetime: , end_datetime: , loc: }   # When (data); STAC field names
n:        {text: , loc: }              # How much
software: {text: not stated, loc: }    # How (tools)
